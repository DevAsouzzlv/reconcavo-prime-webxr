<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col justify-between selection:bg-primary selection:text-on-primary overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface/80 backdrop-blur-md flex justify-between items-center w-full px-gutter py-space-sm fixed top-0 z-50">
<div class="flex items-center gap-space-sm">
<button class="text-primary dark:text-inverse-primary p-space-xs active:scale-95 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm-mobile font-headline-sm text-on-surface dark:text-inverse-surface font-bold tracking-tight">Panorama View</h1>
</div>
<div class="flex items-center gap-space-md">
<div class="hidden xs:flex items-center gap-1 bg-surface-container-high px-2.5 py-1 rounded-full border border-outline-variant/30">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>
<span class="font-label-md text-primary">Giroscópio Ativo</span>
</div>
<button class="text-primary dark:text-inverse-primary p-space-xs active:scale-95 transition-transform hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">view_in_ar</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col pt-14 pb-20 w-full max-w-md mx-auto">
<!-- Upper half: 360 Panoramic View -->
<section class="relative w-full h-[42vh] min-h-[320px] overflow-hidden bg-surface-container-lowest group">
<!-- 360 Image Background with Pan Simulation -->
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-1000 scale-105 hover:scale-100" data-alt="A sophisticated luxury architectural mansion interior seamlessly blending with a tropical exterior twilight landscape, featuring warm amber illumination, floor-to-ceiling glass walls, minimalist obsidian and travertine surfaces, a sleek infinity pool reflecting the dusk sky, and lush palm trees under a deep indigo twilight." style="background-image: url('https://lh3.googleusercontent.com/aida/AEtjO1WzSAiiQ0NLBXOE7ZjkMRmZr-3Grpg_YG9d08c-WsQM1pr3Lsxg6F5UYDzmaVzUEWF62SOa4U8KzqlJSnrP2tNF-U9RfT2m5cC352XdmyvUT4y-VfbqT-GH5c1SmKDuyU8Ig9lWRHjRag5KTOB95UGWr0Y6SaEJ9RJa2Dru3zZP5aGpr9wNQ1hqdmlOrAzxGKC8ohMf-_KDyyh8ugHiez9pKmj7ndr461qQMeYGh0xWvEm4PR5L41FB9Mzj')">
</div>
<!-- Gradient Overlays for Cinematic Depth -->
<div class="absolute inset-0 bg-gradient-to-b from-background/40 via-transparent to-background/80 pointer-events-none"></div>
<!-- Gyroscope / Compass Indicator -->
<div class="absolute top-3 left-3 bg-surface/70 backdrop-blur-md px-3 py-1.5 rounded-full border border-outline-variant/20 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm animate-spin" style="animation-duration: 10s;">explore</span>
<span class="font-label-sm text-on-surface tracking-wider">AZIMUTH 248° SW</span>
</div>
<!-- VR Toggle Mode Button -->
<button class="absolute top-3 right-3 bg-surface-container-high/90 hover:bg-surface-container-highest text-primary px-3 py-1.5 rounded-full border border-outline-variant/30 flex items-center gap-1.5 backdrop-blur-md transition-all active:scale-95 shadow-lg" id="vr-toggle-btn" onclick="toggleVRMode()">
<span class="material-symbols-outlined text-sm">vrpano</span>
<span class="font-label-sm font-bold">Modo VR Box</span>
</button>
<!-- Interactive 3D Hotspots -->
<div class="absolute bottom-16 left-1/4 animate-bounce">
<button class="group/hotspot relative flex items-center gap-2 bg-background/80 hover:bg-primary text-on-background hover:text-on-primary px-3.5 py-1.5 rounded-full border border-primary/50 backdrop-blur-md transition-all shadow-xl">
<span class="absolute -inset-1 rounded-full bg-primary/30 animate-ping"></span>
<span class="material-symbols-outlined text-primary group-hover/hotspot:text-on-primary text-sm">outdoor_grill</span>
<span class="font-label-md">Ir para Área Gourmet</span>
</button>
</div>
<div class="absolute top-1/3 right-8 animate-pulse">
<button class="group/hotspot relative flex items-center gap-2 bg-background/80 hover:bg-primary text-on-background hover:text-on-primary px-3.5 py-1.5 rounded-full border border-primary/50 backdrop-blur-md transition-all shadow-xl">
<span class="absolute -inset-1 rounded-full bg-primary/30 animate-ping"></span>
<span class="material-symbols-outlined text-primary group-hover/hotspot:text-on-primary text-sm">stairs</span>
<span class="font-label-md">Subir para Suíte</span>
</button>
</div>
<!-- Panorama Instructions Footer inside viewer -->
<div class="absolute bottom-3 left-0 w-full text-center pointer-events-none">
<span class="bg-surface/60 backdrop-blur-sm px-3 py-1 rounded-full font-label-sm text-on-surface-variant border border-outline-variant/10">
          Arraste para explorar em 360º ou mova o dispositivo
        </span>
</div>
</section>
<!-- Lower half: Stereoscopic split-screen VR Box headset preview -->
<section class="w-full bg-surface-dim p-space-md flex flex-col gap-space-md border-t border-outline-variant/20 transition-all duration-300" id="vr-container">
<div class="flex justify-between items-center px-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">view_carousel</span>
<h2 class="font-headline-sm text-on-surface font-medium">Headset VR Preview</h2>
</div>
<span class="font-label-sm text-on-surface-variant bg-surface-container px-2 py-0.5 rounded border border-outline-variant/20">Lente Dupla Óptica</span>
</div>
<!-- Stereoscopic Split Screen (Left / Right Lenses) -->
<div class="grid grid-cols-2 gap-3 w-full">
<!-- Left Lens -->
<div class="relative aspect-square rounded-full overflow-hidden border-4 border-surface-container-high bg-surface-container-lowest shadow-2xl flex items-center justify-center group">
<div class="absolute inset-0 bg-cover bg-center scale-125 transform translate-x-3" data-alt="Detailed stereoscopic left-eye view of the luxury modern mansion interior featuring ambient golden lighting and exquisite architectural travertine finishes." style="background-image: url('https://lh3.googleusercontent.com/aida/AEtjO1WzSAiiQ0NLBXOE7ZjkMRmZr-3Grpg_YG9d08c-WsQM1pr3Lsxg6F5UYDzmaVzUEWF62SOa4U8KzqlJSnrP2tNF-U9RfT2m5cC352XdmyvUT4y-VfbqT-GH5c1SmKDuyU8Ig9lWRHjRag5KTOB95UGWr0Y6SaEJ9RJa2Dru3zZP5aGpr9wNQ1hqdmlOrAzxGKC8ohMf-_KDyyh8ugHiez9pKmj7ndr461qQMeYGh0xWvEm4PR5L41FB9Mzj')">
</div>
<!-- Center Reticle for 2s dwell walking -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-4 h-4 rounded-full border-2 border-primary animate-ping opacity-75"></div>
<div class="absolute w-1.5 h-1.5 bg-primary rounded-full shadow-[0_0_8px_#e0c297]"></div>
</div>
<div class="absolute bottom-4 bg-background/60 backdrop-blur-xs px-2 py-0.5 rounded font-label-sm text-primary">ESQ</div>
</div>
<!-- Right Lens -->
<div class="relative aspect-square rounded-full overflow-hidden border-4 border-surface-container-high bg-surface-container-lowest shadow-2xl flex items-center justify-center group">
<div class="absolute inset-0 bg-cover bg-center scale-125 transform translate-x-3" data-alt="Detailed stereoscopic right-eye view of the luxury modern mansion interior featuring ambient golden lighting and exquisite architectural travertine finishes." style="background-image: url('https://lh3.googleusercontent.com/aida/AEtjO1WzSAiiQ0NLBXOE7ZjkMRmZr-3Grpg_YG9d08c-WsQM1pr3Lsxg6F5UYDzmaVzUEWF62SOa4U8KzqlJSnrP2tNF-U9RfT2m5cC352XdmyvUT4y-VfbqT-GH5c1SmKDuyU8Ig9lWRHjRag5KTOB95UGWr0Y6SaEJ9RJa2Dru3zZP5aGpr9wNQ1hqdmlOrAzxGKC8ohMf-_KDyyh8ugHiez9pKmj7ndr461qQMeYGh0xWvEm4PR5L41FB9Mzj')">
</div>
<!-- Center Reticle for 2s dwell walking -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-4 h-4 rounded-full border-2 border-primary animate-ping opacity-75"></div>
<div class="absolute w-1.5 h-1.5 bg-primary rounded-full shadow-[0_0_8px_#e0c297]"></div>
</div>
<div class="absolute bottom-4 bg-background/60 backdrop-blur-xs px-2 py-0.5 rounded font-label-sm text-primary">DIR</div>
</div>
</div>
<!-- VR Dwell Feedback Bar -->
<div class="bg-surface-container px-3 py-2 rounded-xl border border-outline-variant/20 flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">visibility</span>
<span class="font-body-sm text-on-surface-variant">Foco contínuo para navegação (2s)</span>
</div>
<div class="w-20 bg-surface-container-highest h-1.5 rounded-full overflow-hidden">
<div class="bg-primary h-full w-2/3 animate-pulse"></div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex items-center justify-between gap-space-md px-gutter py-space-md bg-surface-container-high/90 backdrop-blur-md">
<a class="flex items-center justify-center bg-surface-container text-on-surface rounded-xl px-space-md py-space-sm w-full hover:opacity-90 transition-opacity active:scale-95 transition-transform shadow-lg group" href="#details">
<span class="material-symbols-outlined mr-2 text-primary">payments</span>
<div class="flex flex-col text-left">
<span class="font-label-sm text-on-surface-variant">Investimento</span>
<span class="font-headline-sm text-primary font-bold">R$ 3.850.000</span>
</div>
</a>
<a class="flex items-center justify-center bg-primary text-on-primary rounded-xl px-space-md py-space-sm w-full hover:opacity-90 transition-opacity active:scale-95 transition-transform shadow-lg" href="https://wa.me/" rel="noopener noreferrer" target="_blank">
<span class="material-symbols-outlined mr-2" style="font-variation-settings: 'FILL' 1;">chat</span>
<span class="font-label-md font-bold">Inquire</span>
</a>
</nav>
<script>
    function toggleVRMode() {
      const vrContainer = document.getElementById('vr-container');
      const btn = document.getElementById('vr-toggle-btn');
      if (vrContainer.classList.contains('hidden')) {
        vrContainer.classList.remove('hidden');
        btn.classList.add('bg-primary', 'text-on-primary');
        btn.classList.remove('bg-surface-container-high', 'text-primary');
      } else {
        vrContainer.classList.add('hidden');
        btn.classList.remove('bg-primary', 'text-on-primary');
        btn.classList.add('bg-surface-container-high', 'text-primary');
      }
    }
  </script>
</body></html>
