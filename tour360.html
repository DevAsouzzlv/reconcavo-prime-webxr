<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Virtual 360º WebXR & Realidade Virtual — Recôncavo Prime</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0f1115',
                        travertine: '#f6f4ee',
                        bronze: '#b89c74',
                        surface: '#16191f',
                        card: '#1b1f27'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Pannellum CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        .vr-split-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100%;
            width: 100%;
            gap: 6px;
            background: #000;
        }
        .vr-eye {
            position: relative;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #222;
        }
        .vr-reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            border: 2px solid #b89c74;
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-obsidian text-travertine font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- HEADER DO TOUR VR (Responsivo para telas pequenas) -->
    <header class="min-h-16 py-2 bg-obsidian/95 border-b border-white/10 px-3 sm:px-6 flex items-center justify-between gap-2 flex-shrink-0 z-30">
        <div class="flex items-center space-x-2 sm:space-x-4 min-w-0">
            <a id="btn-back-dossier" href="mapa.html" class="text-xs text-stone-300 hover:text-white flex items-center space-x-1 flex-shrink-0">
                <span>←</span><span class="hidden xs:inline">Ficha</span>
            </a>
            <span class="text-white/20">|</span>
            <div class="min-w-0">
                <h1 class="font-serif text-sm sm:text-lg text-white font-bold leading-tight truncate max-w-[120px] sm:max-w-xs md:max-w-md" id="header-prop-title">Mansão Villa Imperial</h1>
                <span class="text-[9px] sm:text-[10px] text-bronze uppercase tracking-widest block font-medium truncate" id="header-room-title">Living Principal</span>
            </div>
        </div>

        <!-- CONTROLES IMERSIVOS DE TOPO -->
        <div class="flex items-center space-x-1.5 sm:space-x-3 flex-shrink-0">
            <!-- Botão Giroscópio (Mobile) -->
            <button id="btn-gyro" onclick="toggleGyroscope()" aria-label="Ativar controle de orientação por giroscópio no celular" class="px-2.5 sm:px-3 py-1.5 rounded-full bg-white/10 hover:bg-bronze hover:text-obsidian text-white text-xs font-semibold flex items-center space-x-1 transition active:scale-95">
                <span>🧭</span><span class="hidden sm:inline">Giroscópio</span>
            </button>

            <!-- Botão VR Box (Lente Dupla Estereoscópica) -->
            <button id="btn-vr-toggle" onclick="toggleVREyeMode()" aria-label="Alternar modo de lente dupla estereoscópica para óculos VR Box" class="px-3 sm:px-4 py-1.5 rounded-full bg-bronze hover:bg-bronze-hover text-obsidian text-xs font-bold flex items-center space-x-1 shadow-lg transition active:scale-95">
                <span>🥽</span><span class="hidden xs:inline">VR Box</span><span class="xs:hidden">VR</span>
            </button>

            <!-- Contato Rápido WhatsApp -->
            <a id="btn-header-wa" href="#" target="_blank" aria-label="Iniciar conversa com corretor responsável via WhatsApp" class="px-2.5 sm:px-3 py-1.5 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center space-x-1 transition shadow active:scale-95">
                <span>💬</span><span class="hidden md:inline">WhatsApp</span>
            </a>
        </div>
    </header>

    <!-- ÁREA DO VISUALIZADOR 360 -->
    <main class="flex-grow relative bg-black">
        
        <!-- Dica Flutuante de Onboarding UI/UX -->
        <div id="vr-hint-badge" class="absolute top-4 left-1/2 -translate-x-1/2 bg-card/90 backdrop-blur-md border border-bronze/40 px-4 py-2 rounded-full text-xs text-white shadow-2xl z-20 pointer-events-none transition-opacity duration-1000 flex items-center space-x-2">
            <span>🖐️</span><span>Arraste com o dedo ou mouse para olhar em 360º</span>
        </div>

        <!-- MODO PADRÃO (PANNELLUM MONOCULAR) -->
        <div id="main-pano-viewer" class="w-full h-full"></div>

        <!-- MODO VR BOX ESTEREOSCÓPICO (LENTE DUPLA COM RETÍCULO) -->
        <div id="stereo-vr-viewer" class="hidden w-full h-full p-2 bg-black">
            <div class="vr-split-container">
                <!-- Olho Esquerdo -->
                <div class="vr-eye">
                    <div id="vr-left" class="w-full h-full"></div>
                    <div class="vr-reticle"></div>
                    <span class="absolute bottom-4 left-4 bg-black/70 px-3 py-1 rounded text-xs text-white/80">Lente Esquerda</span>
                </div>
                <!-- Olho Direito -->
                <div class="vr-eye">
                    <div id="vr-right" class="w-full h-full"></div>
                    <div class="vr-reticle"></div>
                    <span class="absolute bottom-4 right-4 bg-black/70 px-3 py-1 rounded text-xs text-white/80">Lente Direita</span>
                </div>
            </div>
            <!-- Dica para encaixe no óculos -->
            <div class="absolute top-4 left-1/2 -translate-x-1/2 bg-black/85 border border-bronze/50 px-4 py-2 rounded-full text-xs text-stone-100 z-50 text-center shadow-2xl">
                🎯 Encaixe o celular no seu óculos VR Box na horizontal
            </div>
        </div>

        <!-- DOCK INFERIOR FLUTUANTE DE TROCA DE CÔMODOS (Scroll suave horizontal) -->
        <div class="absolute bottom-4 sm:bottom-6 left-3 right-3 sm:left-6 sm:right-6 z-20 flex justify-center pointer-events-none">
            <div class="pointer-events-auto bg-obsidian/95 backdrop-blur-xl border border-bronze/30 p-1.5 sm:p-2 rounded-2xl flex items-center space-x-1.5 sm:space-x-2 overflow-x-auto max-w-full shadow-2xl scrollbar-none" id="room-buttons-container">
                <!-- Botões de cômodos injetados dinamicamente -->
            </div>
        </div>
    </main>

    <script src="assets/data.js"></script>
    <script src="assets/ui-helpers.js"></script>
    <script>
        let currentProp;
        let currentRoomKey = 'living';
        let pannellumInstance = null;
        let leftInstance = null;
        let rightInstance = null;
        let isStereoMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const propId = urlParams.get('id') || 'villa-imperial';
            currentProp = getPropertyById(propId);

            document.title = `Tour 360º — ${currentProp.title} | Recôncavo Prime`;
            document.getElementById('header-prop-title').innerText = currentProp.title;
            document.getElementById('btn-back-dossier').href = `detalhes.html?id=${currentProp.id}`;
            document.getElementById('btn-header-wa').href = generateWhatsAppUrl(currentProp, `Olá ${currentProp.broker.name}, estou fazendo o Tour 360º da ${currentProp.title} e gostaria de tirar uma dúvida.`);

            buildRoomDock();
            loadRoom(currentRoomKey);

            // Desaparece com a dica de onboarding suavemente após 3.5s
            setTimeout(() => {
                const hint = document.getElementById('vr-hint-badge');
                if (hint) {
                    hint.style.opacity = '0';
                    setTimeout(() => hint.remove(), 1000);
                }
            }, 3500);
        });

        function buildRoomDock() {
            const container = document.getElementById('room-buttons-container');
            container.innerHTML = '';
            const rooms = currentProp.panoramas;

            Object.keys(rooms).forEach((key, idx) => {
                const room = rooms[key];
                const btn = document.createElement('button');
                btn.id = `dock-btn-${key}`;
                btn.className = `px-4 py-2 rounded-xl text-xs font-semibold transition ${key === currentRoomKey ? 'bg-bronze text-obsidian font-bold' : 'text-white/80 hover:bg-white/10'}`;
                btn.innerText = `${idx + 1}. ${room.title}`;
                btn.onclick = () => loadRoom(key);
                container.appendChild(btn);
            });
        }

        function loadRoom(roomKey) {
            currentRoomKey = roomKey;
            const roomData = currentProp.panoramas[roomKey];
            if (!roomData) return;

            document.getElementById('header-room-title').innerText = `Cômodo: ${roomData.title}`;

            // Atualizar botões do dock
            Object.keys(currentProp.panoramas).forEach(k => {
                const b = document.getElementById(`dock-btn-${k}`);
                if (b) {
                    b.className = `px-4 py-2 rounded-xl text-xs font-semibold transition ${k === roomKey ? 'bg-bronze text-obsidian font-bold' : 'text-white/80 hover:bg-white/10'}`;
                }
            });

            if (isStereoMode) {
                initStereoViewers(roomData.url);
            } else {
                initStandardViewer(roomData);
            }
        }

        function initStandardViewer(roomData) {
            if (pannellumInstance) try { pannellumInstance.destroy(); } catch(e){}

            const formattedHotspots = (roomData.hotspots || []).map(h => ({
                pitch: h.pitch,
                yaw: h.yaw,
                type: 'info',
                text: h.text,
                clickHandlerFunc: h.target ? () => loadRoom(h.target) : null
            }));

            pannellumInstance = pannellum.viewer('main-pano-viewer', {
                type: 'equirectangular',
                panorama: roomData.url,
                autoLoad: true,
                autoRotate: -1.2,
                compass: true,
                showZoomCtrl: true,
                showFullscreenCtrl: true,
                hfov: 110,
                hotSpots: formattedHotspots
            });
        }

        function toggleGyroscope() {
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(res => {
                            if (res === 'granted') {
                                if (pannellumInstance) pannellumInstance.startOrientation();
                                showToast('🧭 Giroscópio ativado! Mova o celular para olhar ao redor.', 'success');
                            } else {
                                showToast('Permissão de giroscópio negada pelo navegador.', 'warning');
                            }
                        }).catch(err => {
                            console.error(err);
                            showToast('Erro ao solicitar acesso aos sensores de orientação.', 'warning');
                        });
                } else {
                    if (pannellumInstance) pannellumInstance.startOrientation();
                    showToast('🧭 Giroscópio ativado! Gire o smartphone para explorar o ambiente.', 'success');
                }
            } else {
                showToast('Sensor de giroscópio não suportado ou indisponível neste navegador.', 'warning');
            }
        }

        function toggleVREyeMode() {
            isStereoMode = !isStereoMode;
            const standard = document.getElementById('main-pano-viewer');
            const stereo = document.getElementById('stereo-vr-viewer');
            const btn = document.getElementById('btn-vr-toggle');

            if (isStereoMode) {
                standard.classList.add('hidden');
                stereo.classList.remove('hidden');
                btn.innerHTML = '<span>✕</span><span>Sair do Modo VR Box</span>';
                initStereoViewers(currentProp.panoramas[currentRoomKey].url);
                showToast('🥽 Modo VR Estereoscópico ativado! Encaixe no óculos.', 'success');
            } else {
                stereo.classList.add('hidden');
                standard.classList.remove('hidden');
                btn.innerHTML = '<span>🥽</span><span>Modo VR Box (Estéreo)</span>';
                initStandardViewer(currentProp.panoramas[currentRoomKey]);
                showToast('Retornado à visão 360º monocular.', 'info');
            }
        }

        function initStereoViewers(panoUrl) {
            if (leftInstance) try { leftInstance.destroy(); } catch(e){}
            if (rightInstance) try { rightInstance.destroy(); } catch(e){}

            leftInstance = pannellum.viewer('vr-left', {
                type: 'equirectangular',
                panorama: panoUrl,
                autoLoad: true,
                autoRotate: -1,
                showControls: false,
                hfov: 95
            });

            rightInstance = pannellum.viewer('vr-right', {
                type: 'equirectangular',
                panorama: panoUrl,
                autoLoad: true,
                autoRotate: -1,
                showControls: false,
                hfov: 95
            });

            leftInstance.on('mouseup', () => {
                rightInstance.setPitch(leftInstance.getPitch());
                rightInstance.setYaw(leftInstance.getYaw());
            });
        }
    </script>
</body>
</html>
